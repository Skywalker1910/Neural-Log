<!DOCTYPE html>
<!--
  The interstitial that exists so signing out can be a POST.

  Nothing about this page is interesting except why it is here: GET /logout used
  to clear the session, which meant a third-party page could sign you out with an
  <img> tag. The links in the classic app all point at GET, so rather than break
  them this page catches the GET and asks.
-->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign out - Neural Log</title>
    <style>
        :root { color-scheme: dark; }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: #000;
            color: #f5f5f7;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        .card {
            width: min(28rem, calc(100vw - 2rem));
            padding: 2rem;
            border: 1px solid #2c2c2e;
            border-radius: 1.25rem;
            background: #111113;
            text-align: center;
        }
        h1 { margin: 0 0 .5rem; font-size: 1.35rem; letter-spacing: -.02em; }
        p { margin: 0 0 1.5rem; color: #98989d; font-size: .9rem; line-height: 1.5; }
        .actions { display: flex; gap: .75rem; justify-content: center; flex-wrap: wrap; }
        button, a.secondary {
            appearance: none;
            border: 1px solid transparent;
            border-radius: 999px;
            padding: .6rem 1.4rem;
            font: inherit;
            font-size: .9rem;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
        }
        button { background: #f5f5f7; color: #000; }
        a.secondary { border-color: #2c2c2e; color: #f5f5f7; }
        button:hover { background: #fff; }
        a.secondary:hover { border-color: #48484a; }
    </style>
</head>
<body>
    <main class="card">
        <h1>Sign out?</h1>
        <p>You'll need your password to get back in. Your logged days stay exactly where they are.</p>
        <form method="post" action="/logout" class="actions">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <button type="submit">Sign out</button>
            <a class="secondary" href="/">Stay signed in</a>
        </form>
    </main>
</body>
</html>
