name: CI

# Runs on every pull request into main, and on main itself after a merge.
#
# The push trigger is not redundant with the pull_request one: a PR is tested
# against a merge commit that does not exist on main until it lands, so a push
# run is the only thing that proves main itself is green.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A second push to a branch makes the first run's answer irrelevant. Cancelling
# it keeps the queue short and the feedback fast.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege. Nothing here writes to the repository, comments on anything,
# or needs a token beyond checkout.
permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          # Matches local development. requirements.txt pins exact versions, so
          # CI installs precisely what runs on the developer's machine.
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        # No secrets needed: tests/conftest.py points every test at an isolated
        # temp database and sets its own SECRET_KEY.
        run: python -m pytest -q

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        # `ci` rather than `install`: it installs exactly the lockfile and fails
        # if package.json and the lock have drifted, which is the whole point of
        # running this on a build machine.
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  migrations:
    name: Migration ledger
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check migrations apply cleanly and are idempotent
        # Deliberately separate from the test suite. The tests run against a
        # database that migrations already built, so they cannot tell you whether
        # a migration works on an EMPTY one, or whether running it twice is safe -
        # and init_db() runs on every boot.
        run: python scripts/check_migrations.py

  image:
    name: Container image
    runs-on: ubuntu-latest
    # Only after the tests agree. The point of publishing from CI is that the
    # artefact in the registry is one that passed - otherwise the instance is
    # pulling whatever was last pushed, tested or not.
    needs: [backend, frontend, migrations]
    permissions:
      contents: read
      # The one job that writes anything, and it writes to the package registry
      # rather than the repository.
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      - name: Sign in to the registry
        # Skipped on pull requests: a fork's token cannot write packages, and a
        # PR has nothing to publish anyway. The build below still runs, so a
        # broken Dockerfile fails the PR rather than main.
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Work out the tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          # metadata-action lowercases the repository name for us; ghcr.io
          # rejects the capital letters in Skywalker1910/Neural-Log.
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long

      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Layer cache in GitHub's own store. The npm install is the expensive
          # layer and it changes about once a month, so this takes a rebuild
          # from ~3 minutes to well under one.
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Lightsail
    runs-on: ubuntu-latest
    needs: [image]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    concurrency:
      group: production-lightsail
      cancel-in-progress: false
    steps:
      - name: Load the deployment key
        env:
          LIGHTSAIL_SSH_KEY: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          LIGHTSAIL_KNOWN_HOSTS: ${{ secrets.LIGHTSAIL_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$LIGHTSAIL_SSH_KEY" > ~/.ssh/lightsail_key
          printf '%s\n' "$LIGHTSAIL_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/lightsail_key ~/.ssh/known_hosts

      - name: Pull the tested image and restart the app
        env:
          LIGHTSAIL_HOST: ${{ secrets.LIGHTSAIL_HOST }}
          LIGHTSAIL_USER: ${{ secrets.LIGHTSAIL_USER }}
        run: |
          image_tag="ghcr.io/${GITHUB_REPOSITORY,,}:sha-${GITHUB_SHA}"
          ssh -i ~/.ssh/lightsail_key -o IdentitiesOnly=yes "$LIGHTSAIL_USER@$LIGHTSAIL_HOST" \
            "cd /srv/neurallog && sudo env NEURAL_LOG_IMAGE='$image_tag' docker compose pull app && sudo env NEURAL_LOG_IMAGE='$image_tag' docker compose up -d --wait --wait-timeout 120"

      - name: Verify the public health endpoint
        run: curl --fail --silent --show-error --retry 5 --retry-delay 5 https://neurallog.adityamore.dev/healthz
