# Dependency updates - currently DISABLED. See "Turning this back on" below.
#
# WHAT WENT WRONG THE FIRST TIME
# ------------------------------
# The original version of this file opened seven pull requests within two hours
# of landing, which is exactly the noise its own comments said to avoid. Three
# separate mistakes, all in one config:
#
#   1. The grouping only covered `minor` and `patch`. Every update that actually
#      arrived was a MAJOR bump - typescript 6 to 7, pytest 8 to 9, gunicorn 22
#      to 26 - so the grouping excluded all of them and each got its own PR.
#
#   2. `open-pull-requests-limit` is PER ECOSYSTEM, not total. Three ecosystems
#      at three each is nine PRs, not three.
#
#   3. `interval: monthly` is how often Dependabot CHECKS, not a delay before it
#      starts. It ran the moment this file reached the default branch.
#
# Two of the three major bumps failed CI, which is the system working - but they
# needed deliberate work, not a merge, and they arrived mid-phase as pure
# distraction.
#
# WHAT IS DIFFERENT NOW
# ---------------------
# `patterns: ["*"]` with no `update-types` filter groups EVERYTHING - majors
# included - into a single pull request per ecosystem. One PR a month per
# ecosystem, reviewable in one sitting, instead of nine to triage.
#
# TURNING THIS BACK ON
# --------------------
# Change `open-pull-requests-limit` from 0 to 1 in each block. Zero disables
# version updates for that ecosystem; the rest of the config stays correct and
# ready.
#
# The right moment is the Ship phase. Until then the stack is still moving under
# its own steam every phase, and a dependency PR competes with real work.
#
# NOTE: this only governs VERSION updates. Dependabot SECURITY alerts are a
# separate repository setting and should stay on - those are rare and worth
# interrupting for.
version: 2

updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: monthly
    # 0 disables. Set to 1 to re-enable - see above.
    open-pull-requests-limit: 0
    groups:
      frontend-dependencies:
        patterns: ["*"]

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    groups:
      python-dependencies:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    groups:
      actions:
        patterns: ["*"]
